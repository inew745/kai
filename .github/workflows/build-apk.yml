name: Build Flutter APK

on:
  push:
    branches: [main, master, claude/**]
    paths:
      - 'flutter_app/**'
  pull_request:
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release)
        working-directory: flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk artifacts/Kai.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kai-APK
          path: artifacts/Kai.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Kai-APK
          path: artifacts/

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'version:' flutter_app/pubspec.yaml | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kai ${{ steps.version.outputs.tag }}
          body: |
            ## Kai AI Chatbot - ${{ steps.version.outputs.tag }}

            עוזר AI חכם מבוסס DialoGPT-medium.

            ### התקנה
            1. הורד את `Kai.apk`
            2. אפשר "מקורות לא ידועים" בהגדרות Android
            3. פתח והתקן את הקובץ

            ### שינויים
            ${{ github.event.head_commit.message }}
          files: artifacts/Kai.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
